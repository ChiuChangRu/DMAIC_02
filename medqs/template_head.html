<style>
/* Layout: Persona Builder workbench — navy masthead, cream ground, input pane left, sticky verdict + box plot right, full-width result sheets below. */

  --font-body: Calibri, "Carlito", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131A20; --surface: #1B242C; --ink: #EDE7DC; --muted: #A3AEB8; --line: #2E3A44;
    --teal: #7DB0AA; --copper: #D8995F; --navy: #A9BCD0; --teal-soft: #1E3533; --copper-soft: #3A2B1D; --navy-soft: #263340;
    --copper-text: #E0A86F; --btn-copper: #D8995F; --band: #0D1317; --band-ink: #F5F1EA; --band-muted: #A9B3BC; --on-accent: #11181D; --code-bg: #161E25;
    --chart-a: #23A194; --chart-b: #C77F3E; --grid: #26313A;
    --good: #6CC08E; --good-soft: #1C3326; --bad: #E58A84; --bad-soft: #3A2120; --warn-soft: #362B14; --warn-ink: #E8C27A;

}
:root[data-theme="dark"] {
  --bg: #131A20; --surface: #1B242C; --ink: #EDE7DC; --muted: #A3AEB8; --line: #2E3A44;
  --teal: #7DB0AA; --copper: #D8995F; --navy: #A9BCD0; --teal-soft: #1E3533; --copper-soft: #3A2B1D; --navy-soft: #263340;
  --copper-text: #E0A86F; --btn-copper: #D8995F; --band: #0D1317; --band-ink: #F5F1EA; --band-muted: #A9B3BC; --on-accent: #11181D; --code-bg: #161E25;
  --chart-a: #23A194; --chart-b: #C77F3E; --grid: #26313A;
  --good: #6CC08E; --good-soft: #1C3326; --bad: #E58A84; --bad-soft: #3A2120; --warn-soft: #362B14; --warn-ink: #E8C27A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 48px; }

.top-row { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 24px; }
.eyebrow { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #D8995F; font-weight: 700; }

.lede { color: var(--band-muted); max-width: 64ch; margin: 0; }

.ai-st { color: #D8D2C6; }

header .btn { background: #F5F1EA; color: #1F2933; border-color: #F5F1EA; }
header .btn:hover { background: #FFFFFF; }
header .btn.ghost { background: transparent; color: #F5F1EA; border-color: rgba(245,241,234,.4); }
nav.tabs { display: flex; gap: 4px; margin-top: 22px; padding-bottom: 8px; }
nav.tabs button { font: inherit; font-size: 15px; font-weight: 700; color: var(--band-muted); background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px 10px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: #F5F1EA; border-bottom-color: #D8995F; }

.step { display: grid; gap: 12px; min-width: 0; }
.step + .step { padding-top: 22px; border-top: 1px solid var(--line); }
.qref { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--on-accent); background: var(--teal); border-radius: 4px; padding: 2px 8px; justify-self: start; }

.help { color: var(--muted); margin: 0; max-width: 62ch; font-size: 15px; }

[hidden] { display: none !important; }
.scroll-x { overflow-x: auto; max-width: 100%; }

.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; font-weight: 700; color: var(--muted); }
.field small { color: var(--muted); font-size: 12.5px; }
.group-label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); font-weight: 700; }
.btn { font: inherit; font-size: 15px; font-weight: 700; border-radius: 8px; padding: 9px 18px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.btn:hover { border-color: var(--teal); }

.run-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.hint { font-size: 14px; color: var(--muted); }

.preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); padding: 0; overflow: hidden; }

.preview-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 18px; background: var(--band); flex-wrap: wrap; }
.filename { font-family: var(--font-mono); font-size: 13px; color: #A9BCD0; }

.eqc { margin: 10px 0 4px; }
.eqc svg { width: 100%; height: auto; display: block; }
.eqc-band { fill: var(--good-soft); }
.eqc-lim { stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 5 4; }
.eqc-zero { stroke: var(--muted); stroke-width: 1; }
.eqc-ci { stroke-width: 3; } .eqc-ci.ok { stroke: var(--good); } .eqc-ci.no { stroke: var(--bad); }
.eqc-pt.ok { fill: var(--good); } .eqc-pt.no { fill: var(--bad); }
.eqc-lab, .eqc-val { font-size: 16px; fill: var(--muted); } .eqc-val { fill: var(--ink); }

.verdict p { margin: 0; }
.verdict .big { font-family: var(--font-display); font-size: 21px; line-height: 1.35; text-wrap: balance; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kv div { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.kv span { display: block; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .03em; }
.kv b { font-family: var(--font-mono); font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.12); font-variant-numeric: tabular-nums; white-space: nowrap; z-index: 3; }
.tip b { font-weight: 700; }

.sheets { display: grid; gap: 20px; margin-top: 24px; }
.sheet h3 { font-family: var(--font-display); font-weight: 500; font-size: 21px; margin: 0 0 4px; color: var(--ink); display: flex; align-items: center; gap: 10px; text-wrap: balance; }
.sheet h3::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--copper); flex: none; }
.sheet .help { margin-bottom: 12px; }
.sheet-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 900px) { .sheet-grid { grid-template-columns: minmax(0, 1fr); } }
tr.chosen td { background: var(--teal-soft); font-weight: 700; }
tr.chosen td:first-child::before { content: "\2713\00a0"; color: var(--teal); }
.reasons { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 80ch; }
.reasons li::marker { color: var(--copper-text); font-weight: 700; }
.stale { display: none; }
.is-stale .stale { display: block; }

.chat { display: grid; gap: 14px; }
.msgs { display: grid; gap: 12px; max-height: 560px; overflow-y: auto; padding-right: 4px; }
.msg { border-radius: 10px; padding: 12px 14px; max-width: 78ch; min-width: 0; overflow-wrap: anywhere; }
.msg.user { background: var(--navy-soft); justify-self: end; }
.msg.ai { background: var(--code-bg); border: 1px solid var(--line); }

.msg.ai ul, .msg.ai ol { margin: 4px 0 8px; padding-left: 22px; }
.msg .who { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; margin-bottom: 4px; }
.msg.thinking .body { color: var(--muted); font-style: italic; }
.ask { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.ask textarea { min-height: 52px; font-family: var(--font-body); font-size: 15px; }
.ask .btns { display: flex; gap: 8px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }

.tile span { display: block; font-size: 13px; color: var(--muted); font-weight: 700; }
.tile b { font-family: var(--font-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.status { font-weight: 700; white-space: nowrap; }
.status.ok { color: var(--good); }
.status.ng { color: var(--bad); }
.badge { display: inline-block; font-weight: 700; border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.badge.ok { background: var(--good-soft); color: var(--good); }
.badge.ng { background: var(--bad-soft); color: var(--bad); }
details summary { cursor: pointer; font-weight: 700; color: var(--teal); }
details[open] summary { margin-bottom: 10px; }
.method { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 86ch; }
footer { margin-top: 32px; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; border-top: 3px solid var(--teal); padding-top: 14px; }
footer b { font-family: var(--font-display); font-weight: 500; color: var(--copper-text); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.series-list { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.series-list label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.series-list input { width: 16px; height: 16px; accent-color: var(--teal); }
.mode-tag { display: inline-block; font-weight: 700; color: var(--on-accent); background: var(--copper); border-radius: 4px; padding: 1px 8px; font-size: 13px; }
.pair-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.pair-box { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; background: var(--code-bg); min-width: 0; }

.pair-result { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; min-width: 0; }
.pair-result .big { font-family: var(--font-display); font-size: 18px; margin: 0; }
a.link { color: var(--teal); font-weight: 700; }
.pair-result .chart-wrap { max-width: 520px; }
.pair-result .verdict, .pair-result .kv { max-width: 760px; }
.toolnav { overflow-x: auto; scrollbar-width: none; }
.toolnav::-webkit-scrollbar { display: none; }
.toolnav button { white-space: nowrap; }
.tool-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 16px; }
.tool-title { font-family: var(--font-display); font-weight: 500; font-size: 26px; margin: 0; }
.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.tool-card { font: inherit; text-align: left; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--teal); border-radius: 12px; padding: 18px 18px 20px; display: grid; gap: 8px; align-content: start; cursor: pointer; min-width: 0; }
.tool-card:nth-child(even) { border-top-color: var(--copper); }
.tool-card:hover { border-color: var(--teal); }
.tool-card:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
.tool-name { font-family: var(--font-display); font-size: 21px; font-weight: 500; }
.tool-desc { color: var(--muted); font-size: 15px; }
.disclaimer { font-size: 14px; line-height: 1.6; }
.ask-ai { margin-left: auto; font: inherit; font-family: var(--font-body); font-size: 13px; font-weight: 700; color: var(--teal); background: var(--teal-soft); border: 1px solid transparent; border-radius: 999px; padding: 3px 12px; cursor: pointer; white-space: nowrap; }
.ask-ai:hover { border-color: var(--teal); }
.ask-ai:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
.preview-head .ask-slot { margin-left: auto; display: flex; }
.preview-head .ask-ai { background: rgba(245,241,234,.12); color: #F5F1EA; }
.ai-fab { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40; font: inherit; font-size: 15px; font-weight: 700; color: var(--on-accent); background: var(--btn-copper); border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer; box-shadow: 0 8px 22px rgba(0,0,0,.22); display: inline-flex; align-items: center; gap: 8px; }
.ai-fab:hover { filter: brightness(1.08); }
.ai-fab:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
.ai-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--on-accent); }

/* 解決問題流程列 */
.flow-wrap { margin: 14px 0 6px; }
.flowbar { background: color-mix(in srgb, var(--qic-a) 12%, var(--surface)); border: 2px solid color-mix(in srgb, var(--qic-a) 55%, var(--line)); border-radius: 16px; padding: 14px 18px 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
.fl-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.fl-t { font-size: 18px; font-weight: 800; color: var(--ink); }
.fl-t small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 10px; }
.fl-act { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.fl-save-t { font-size: 12.5px; color: var(--muted); }
.fl-save { font: inherit; font-size: 14px; font-weight: 800; background: var(--act); color: var(--on-act); border: 0; border-radius: 999px; padding: 6px 16px; cursor: pointer; }
.fl-save.ok { background: var(--good); }
.fl-x { border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; border-radius: 999px; padding: 4px 12px; }
.flowbar ol { list-style: none; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin: 0; padding: 0; }
.flowbar li { position: relative; display: flex; justify-content: center; }
.flowbar li + li::before { content: ""; position: absolute; left: -50%; right: 50%; top: 26px; height: 4px; background: var(--line); z-index: 0; }
.flowbar li.done + li::before { background: var(--qic-a); }
.flowbar .st { position: relative; z-index: 1; font: inherit; border: 0; background: none; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 4px; }
.flowbar .dot { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 800; border: 3px solid var(--muted); color: var(--muted); background: var(--surface); transition: transform .15s; }
.flowbar .st:hover .dot { transform: scale(1.07); }
.flowbar .lab { font-size: 16px; font-weight: 800; }
.flowbar .sub { font-size: 12.5px; color: var(--muted); }
.flowbar .done .dot { background: var(--qic-a); border-color: var(--qic-a); color: #fff; }
.flowbar .done .sub { color: var(--qic-a); font-weight: 700; }
.flowbar .now .dot { background: var(--act); border-color: var(--act); color: #fff; animation: flPulse 1.6s ease-out infinite; }
.flowbar .now .lab, .flowbar .now .sub { color: var(--act-text); } .flowbar .now .sub { font-weight: 700; }
.flowbar li.now + li::before { background: linear-gradient(90deg, var(--act) 0 30%, var(--line) 30% 100%); background-size: 200% 100%; animation: flFlow 1.6s linear infinite; }
@keyframes flPulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--act) 55%, transparent); } 70% { box-shadow: 0 0 0 14px color-mix(in srgb, var(--act) 0%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes flFlow { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@media (prefers-reduced-motion: reduce) { .flowbar .now .dot { animation: none; box-shadow: 0 0 0 6px color-mix(in srgb, var(--act) 25%, transparent); } .flowbar li.now + li::before { animation: none; } }
.fl-minirow { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
.fl-open { font: inherit; font-size: 14px; font-weight: 700; border: 2px solid color-mix(in srgb, var(--qic-a) 55%, var(--line)); background: color-mix(in srgb, var(--qic-a) 12%, var(--surface)); color: var(--ink); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
.fl-open b { color: var(--qic-a); }
.fl-resume { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; background: var(--warn-soft); color: var(--ink); border-radius: 10px; padding: 8px 14px; margin-bottom: 8px; font-size: 14px; }
.fl-mini-btn { font: inherit; font-size: 13px; font-weight: 700; background: var(--act); color: var(--on-act); border: 0; border-radius: 999px; padding: 4px 14px; cursor: pointer; }
@media (max-width: 720px) {
  .flowbar ol { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 14px; }
  .flowbar li:nth-child(4)::before { display: none; }
  .flowbar .dot { width: 40px; height: 40px; font-size: 16px; } .flowbar li + li::before { top: 20px; }
  .flowbar .lab { font-size: 14px; } .fl-t small { display: block; margin: 2px 0 0; }
}
